services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: eduspace
      POSTGRES_USER: edu
      POSTGRES_PASSWORD: edupass123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  livekit:
    image: livekit/livekit-server:latest
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-devkey}: ${LIVEKIT_API_SECRET:-eduspace-local-livekit-secret-change-before-production}"
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    command:
      - "--config"
      - "/etc/livekit.yaml"
    volumes:
      - ./infra/livekit/livekit.yaml:/etc/livekit.yaml:ro
    depends_on:
      - redis

  livekit-egress:
    image: livekit/egress:latest
    environment:
      EGRESS_CONFIG_FILE: /etc/egress.yaml
      LIVEKIT_API_KEY: "${LIVEKIT_API_KEY:-devkey}"
      LIVEKIT_API_SECRET: "${LIVEKIT_API_SECRET:-eduspace-local-livekit-secret-change-before-production}"
      LIVEKIT_WS_URL: ws://livekit:7880
    volumes:
      - ./infra/livekit/egress.yaml:/etc/egress.yaml:ro
      - ./backend/media/recordings:/out
    depends_on:
      - livekit
      - redis

  gotenberg:
    image: gotenberg/gotenberg:8.34.0-libreoffice
    command:
      - "gotenberg"
      - "--libreoffice-auto-start=true"
      - "--libreoffice-max-queue-size=4"
      - "--api-timeout=120s"
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

volumes:
  pgdata:
