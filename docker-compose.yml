services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: eduspace
      POSTGRES_USER: edu
      POSTGRES_PASSWORD: edupass123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edu -d eduspace"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    # Local development only. The public Community image is archived; do not
    # reuse this pinned image as the production object-store deployment.
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-eduspace}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-eduspace-local-minio-secret}
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - miniodata:/data

  minio-init:
    image: minio/mc:latest
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-eduspace}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-eduspace-local-minio-secret}
      MEDIA_BUCKET: ${AWS_STORAGE_BUCKET_NAME:-eduspace-media}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do sleep 2; done
        mc mb --ignore-existing "local/$$MEDIA_BUCKET"
        mc anonymous set none "local/$$MEDIA_BUCKET"
    depends_on:
      minio:
        condition: service_started

  media-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["celery", "-A", "config", "worker", "--loglevel=info", "--queues=media", "--concurrency=1", "--hostname=media-local@%h"]
    environment:
      DEBUG: "True"
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: eduspace
      DB_USER: edu
      DB_PASSWORD: edupass123
      REDIS_HOST: redis
      S3_ENABLED: "True"
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-eduspace}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-eduspace-local-minio-secret}
      AWS_STORAGE_BUCKET_NAME: ${AWS_STORAGE_BUCKET_NAME:-eduspace-media}
      AWS_S3_ENDPOINT_URL: http://minio:9000
      AWS_S3_ADDRESSING_STYLE: path
      MEDIA_PROGRESSIVE_UPLOAD_ENABLED: ${MEDIA_PROGRESSIVE_UPLOAD_ENABLED:-False}
      MEDIA_PROGRESSIVE_INGEST_ENABLED: ${MEDIA_PROGRESSIVE_INGEST_ENABLED:-False}
      MEDIA_INSPECTION_TMP_ROOT: /tmp/eduspace-media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    mem_limit: 1g
    cpus: 2

  media-ingest-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["celery", "-A", "config", "worker", "--loglevel=info", "--queues=media-ingest", "--concurrency=1", "--hostname=media-ingest-local@%h"]
    environment:
      DEBUG: "True"
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: eduspace
      DB_USER: edu
      DB_PASSWORD: edupass123
      REDIS_HOST: redis
      S3_ENABLED: "True"
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-eduspace}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-eduspace-local-minio-secret}
      AWS_STORAGE_BUCKET_NAME: ${AWS_STORAGE_BUCKET_NAME:-eduspace-media}
      AWS_S3_ENDPOINT_URL: http://minio:9000
      AWS_S3_ADDRESSING_STYLE: path
      MEDIA_PROGRESSIVE_UPLOAD_ENABLED: ${MEDIA_PROGRESSIVE_UPLOAD_ENABLED:-False}
      MEDIA_PROGRESSIVE_INGEST_ENABLED: ${MEDIA_PROGRESSIVE_INGEST_ENABLED:-False}
      MEDIA_INSPECTION_TMP_ROOT: /tmp/eduspace-media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    mem_limit: 1g
    cpus: 2

  livekit:
    image: livekit/livekit-server:latest
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-devkey}: ${LIVEKIT_API_SECRET:-eduspace-local-livekit-secret-change-before-production}"
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    command:
      - "--config"
      - "/etc/livekit.yaml"
    volumes:
      - ./infra/livekit/livekit.yaml:/etc/livekit.yaml:ro
    depends_on:
      - redis

  livekit-egress:
    image: livekit/egress:latest
    environment:
      EGRESS_CONFIG_FILE: /etc/egress.yaml
      LIVEKIT_API_KEY: "${LIVEKIT_API_KEY:-devkey}"
      LIVEKIT_API_SECRET: "${LIVEKIT_API_SECRET:-eduspace-local-livekit-secret-change-before-production}"
      LIVEKIT_WS_URL: ws://livekit:7880
    volumes:
      - ./infra/livekit/egress.yaml:/etc/egress.yaml:ro
      - ./backend/media/recordings:/out
    depends_on:
      - livekit
      - redis

  gotenberg:
    image: gotenberg/gotenberg:8.34.0-libreoffice
    command:
      - "gotenberg"
      - "--libreoffice-auto-start=true"
      - "--libreoffice-max-queue-size=4"
      - "--api-timeout=120s"
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

volumes:
  pgdata:
  miniodata:
