# This is standalone. Never merge with the local docker-compose.yml.
x-logging: &logging
  driver: json-file
  options: {max-size: '10m', max-file: '3'}
x-app: &app
  image: eduspace-backend:${DEPLOY_ENV:?}-${RELEASE_ID:-local}
  build:
    context: .
    dockerfile: backend/Dockerfile
  env_file: ["${SERVER_ENV_FILE:?}"]
  environment:
    DJANGO_SETTINGS_MODULE: config.server_settings
    DEPLOY_ENV: ${DEPLOY_ENV:?}
    DEBUG: 'False'
    USE_SQLITE: 'False'
    DB_HOST: db
    DB_PORT: '5432'
    REDIS_HOST: redis
    GOTENBERG_URL: http://gotenberg:3000
    LIVEKIT_HOST_URL: http://livekit:7880
    LIVEKIT_WS_URL: wss://${RTC_DOMAIN:?}
    RECORDING_OUTPUT_DIR: media/recordings
  volumes:
    - media:/app/media
    - recordings:/app/media/recordings
    - private_media:/app/private_media
    - static:/app/staticfiles
  restart: unless-stopped
  stop_grace_period: 120s
  logging: *logging
  networks: [default]

services:
  db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: ${DB_NAME:?}
      POSTGRES_USER: ${DB_USER:?}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    logging: *logging
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, 'yes']
    volumes: [redisdata:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    logging: *logging
  init-storage:
    <<: *app
    user: '0:0'
    restart: 'no'
    command:
      - sh
      - -ec
      - 'mkdir -p /app/private_media/presentation_sources /app/private_media/media_inspection; chown 10001:2000 /app/media /app/media/recordings /app/private_media /app/private_media/presentation_sources /app/private_media/media_inspection /app/staticfiles; chmod 2775 /app/media /app/staticfiles; chmod 2770 /app/media/recordings /app/private_media /app/private_media/presentation_sources /app/private_media/media_inspection'
  backend:
    <<: *app
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      init-storage: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz/', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
  worker:
    <<: *app
    command: [celery, -A, config, worker, --loglevel=info, '--queues=default,documents,notifications,recordings,compliance,finance', '--concurrency=2', '--hostname=worker@%h']
    depends_on:
      backend: {condition: service_healthy}
      gotenberg: {condition: service_healthy}
  media-worker:
    <<: *app
    command: [celery, -A, config, worker, --loglevel=info, '--queues=media', '--concurrency=1', '--hostname=media@%h']
    depends_on:
      backend: {condition: service_healthy}
    mem_limit: 1g
    cpus: 2
  media-ingest-worker:
    <<: *app
    command: [celery, -A, config, worker, --loglevel=info, '--queues=media-ingest', '--concurrency=1', '--hostname=media-ingest@%h']
    depends_on:
      backend: {condition: service_healthy}
    mem_limit: 1g
    cpus: 2
  beat:
    <<: *app
    command: [celery, -A, config, beat, --loglevel=info, '--pidfile=/tmp/celerybeat.pid']
    depends_on:
      backend: {condition: service_healthy}
  web:
    image: eduspace-web:${DEPLOY_ENV:?}-${RELEASE_ID:-local}
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports: ['127.0.0.1:${WEB_PORT:?}:80']
    volumes:
      - media:/srv/media:ro
      - static:/srv/static:ro
    networks:
      default:
      edge:
        aliases: ['eduspace-${DEPLOY_ENV}-web']
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1/healthz]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    logging: *logging
  livekit:
    image: ${LIVEKIT_IMAGE:-livekit/livekit-server:v1.13.6}
    command: ['--config', /etc/livekit.yaml]
    environment:
      LIVEKIT_KEYS: '${LIVEKIT_API_KEY:?}: ${LIVEKIT_API_SECRET:?}'
    ports:
      - '127.0.0.1:${RTC_HTTP_PORT:?}:7880'
      - '${RTC_TCP_PORT:?}:${RTC_TCP_PORT:?}/tcp'
      - '${RTC_UDP_PORT:?}:${RTC_UDP_PORT:?}/udp'
      - '${TURN_UDP_PORT:?}:${TURN_UDP_PORT:?}/udp'
    volumes: ['${SERVER_CONFIG_DIR:?}/livekit.yaml:/etc/livekit.yaml:ro']
    networks:
      default:
      edge:
        aliases: ['eduspace-${DEPLOY_ENV}-rtc']
    depends_on:
      redis: {condition: service_healthy}
    restart: unless-stopped
    logging: *logging
  egress:
    image: ${EGRESS_IMAGE:-livekit/egress:v1.14.1}
    cap_add: [SYS_ADMIN]
    group_add: ['2000']
    shm_size: 1gb
    healthcheck:
      test: [CMD, curl, --fail, http://127.0.0.1:9090/]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    environment:
      EGRESS_CONFIG_FILE: /etc/egress.yaml
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?}
      LIVEKIT_WS_URL: ws://livekit:7880
    volumes:
      - ./infra/server/egress.yaml:/etc/egress.yaml:ro
      - recordings:/out
    depends_on:
      livekit: {condition: service_started}
      backend: {condition: service_healthy}
    restart: unless-stopped
    stop_grace_period: 120s
    logging: *logging
  gotenberg:
    image: gotenberg/gotenberg:8.34.0-libreoffice
    command: [gotenberg, '--libreoffice-auto-start=true', '--libreoffice-max-queue-size=4', '--api-timeout=120s']
    mem_limit: 2g
    cpus: 2
    healthcheck:
      test: [CMD, curl, --fail, http://localhost:3000/health]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    logging: *logging
volumes:
  pgdata:
  redisdata:
  media:
  recordings:
  private_media:
  static:
networks:
  default:
  edge:
    external: true
    name: eduspace-edge
