# LiveKit Egress worker configuration.
# Picks up RoomComposite jobs from redis and writes the resulting MP4
# to the shared volume mounted at /out (-> backend/media/recordings/).
# API credentials and the LiveKit URL are injected by Docker Compose.

redis:
  address: redis:6379

# Local file output. The egress container needs write access to /out,
# which is bind-mounted from backend/media/recordings on the host.
local_directory: /out

# ─── Recording quality ───────────────────────────────────────────────────────
# These settings control the output file quality for RoomComposite recordings.
# 720p/30fps is a good balance between file size and quality for educational content.
room_composite_options:
  width:     1280
  height:    720
  framerate: 30
  # Video codec: H.264 is the most universally playable (works on iOS, Android,
  # all browsers) and is hardware-accelerated on most servers.
  video_codec: H264_MAIN
  video_bitrate: 2500  # kbps — good quality at 720p
  audio_bitrate:  128  # kbps — AAC, clear speech and audio

# ─── Worker resource limits ──────────────────────────────────────────────────
cpu_cost:
  # DEV: limit to 3 CPU cores per recording on a dev box.
  # PRODUCTION: lower this (e.g. 1.5) to allow more concurrent recordings
  # on a production server with more cores.
  room_composite_cpu_cost: 3

# Health check endpoint — used by Docker / k8s to verify the worker is alive.
health_port: 9090
