resolver 127.0.0.11 valid=10s ipv6=off;
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 110m;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;

    location = /healthz { access_log off; return 200 'ok'; }
    # Internal probes and signed webhooks do not need a public route.
    location ~ ^/(healthz/|readyz/|api/recordings/webhook/) { return 404; }
    location ~ ^/(api/|admin/|ws/) {
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # This listener is private (loopback / Docker); public ingress MUST use TLS.
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }
    # Path-routed to the bundled MinIO object store so presigned shared-media
    # uploads stay same-origin (no CORS). Byte-identical passthrough is required:
    # SigV4 signs this exact path, so it must equal the bucket name with no
    # rewriting. Renaming AWS_STORAGE_BUCKET_NAME requires renaming this block.
    location ^~ /eduspace-media/ {
        set $minio http://minio:9000;
        proxy_pass $minio;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;
        proxy_buffering off;
    }
    location /static/ { alias /srv/static/; }
    # Recordings must pass through the authenticated streaming API.
    location = /media/recordings { return 404; }
    location ^~ /media/recordings/ { return 404; }
    location ^~ /private_media/ { return 404; }
    location /media/ {
        alias /srv/media/;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self' data:; style-src 'unsafe-inline'; frame-ancestors 'self'" always;
    }
    location / { try_files $uri $uri/ /index.html; }
}
